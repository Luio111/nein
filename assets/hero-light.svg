    <path d="M36 78 L28 102 L62 78 Z" fill="#eceef1"/>
    <text x="186" y="49" text-anchor="middle" class="sans" font-size="27" font-weight="500" fill="#3a3f45">You're absolutely right!</text>
    <line x1="18" y1="42" x2="354" y2="36" stroke="#D7261E" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="1130" y="268" text-anchor="end" class="sans" font-size="236" font-weight="900" letter-spacing="-8" fill="#111111">NEIN<tspan fill="#D7261E">.</tspan></text>
  <text x="1130" y="346" text-anchor="end" class="sans" font-size="34" font-weight="500" fill="#55595f">German directness for AI agents.</text>
  <text x="1130" y="392" text-anchor="end" class="sans" font-size="24" font-weight="400" fill="#55595f">Ja · Nein · Jein — always with a reason.</text>
