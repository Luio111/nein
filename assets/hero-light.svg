<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">NEIN.</title>
  <desc id="d">A chat bubble saying "You're absolutely right!" is struck through in red. Next to it, in huge letters: NEIN. Below: German directness for AI agents.</desc>
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
  </style>
  <g transform="translate(70 118)">
